<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>جلسهٔ هماهنگی مهر هشتم</title>
  <meta name="theme-color" content="#0f766e">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/logo-mehr8-tile.png">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/liveclass.css">
  <style>
    .on-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .on-card { width: 100%; max-width: 440px; }
    .on-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .on-head img { width: 52px; height: 52px; }
    .on-head h1 { font-size: 20px; margin: 0; }
    .on-head p { margin: 0; color: var(--ink2); font-size: 14px; }
    .on-who { display: grid; gap: 8px; margin: 0 0 14px; padding: 0; border: 0; }
    .on-who legend { font-weight: 700; margin-bottom: 6px; }
    .on-who label { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
    .on-who label:has(input:checked) { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); background: var(--brand2); }
    .on-code { display: grid; gap: 6px; margin-bottom: 14px; font-weight: 700; }
    .on-code input { font: inherit; font-size: 18px; letter-spacing: .2em; text-align: center; padding: 10px; border: 1px solid var(--line2); border-radius: 11px; direction: ltr; }
    .on-err { color: #b91c1c; min-height: 1.6em; margin: 0 0 8px; font-weight: 700; }
    .on-card .btn { width: 100%; min-height: 48px; font-size: 16px; }
    .on-card .btn + .btn { margin-top: 8px; }
    .on-note { color: var(--ink2); font-size: 14px; margin: 12px 0; }
    .on-note li { margin-bottom: 4px; }
  </style>
</head>
<body>
  <main id="app" class="on-wrap"></main>
  <div id="modal-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>window.SchoolData = window.SchoolData || {};</script>
  <script src="js/ui.js"></script>
  <script src="js/jdate.js"></script>
  <script src="js/liveclass.js"></script>
  <script src="js/online.js"></script>
</body>
</html>
