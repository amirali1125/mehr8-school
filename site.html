<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>متوسطهٔ پسرانهٔ مهر هشتم</title>
  <meta name="description" content="متوسطهٔ پسرانهٔ مهر هشتم، از مدارس مجتمع آموزشی مهر هشتم؛ دورهٔ اول و دوم متوسطه؛ یادگیری برای زندگی معنوی.">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="assets/logo-mehr8-tile.png">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <a class="skip" href="#main">پرش به محتوای اصلی</a>
  <header class="st-head" id="top"></header>
  <main id="main" tabindex="-1"></main>
  <!-- Opened straight from inside a zip, Windows copies only this file: no styles, code or other pages come with it. -->
  <div id="zip-warn" hidden style="max-width:640px;margin:40px auto;padding:20px 24px;border:2px solid #b45309;border-radius:14px;background:#fff7e0;color:#142624;font:16px/1.9 Tahoma,sans-serif;direction:rtl">
    <b>سایت از داخل فایل zip باز شده و کار نمی‌کند.</b><br>
    روی فایل zip راست‌کلیک کنید، «Extract All» را بزنید، بعد در پوشهٔ باز‌شده روی <b>index.html</b> دوبار کلیک کنید.
  </div>
  <script>addEventListener('load', () => { if (!document.getElementById('main').children.length) document.getElementById('zip-warn').hidden = false; });</script>
  <footer class="st-foot" id="foot"></footer>
  <script src="js/site-staff.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
